</style><main><header>Curso de Contabilidade<br>Professor Moreira</header><div id="app"></div><footer>Quem quer ser aprovado estuda.</footer></main><script>
const BANK=[{"name": "Caixa", "classification": "Ativo Circulante"}, {"name": "Bancos Conta Movimento", "classification": "Ativo Circulante"}, {"name": "Aplicações Financeiras", "classification": "Ativo Circulante"}, {"name": "Clientes", "classification": "Ativo Circulante"}, {"name": "Duplicatas a Receber", "classification": "Ativo Circulante"}, {"name": "Mercadorias para Revenda", "classification": "Ativo Circulante"}, {"name": "Produtos Acabados", "classification": "Ativo Circulante"}, {"name": "Produtos em Elaboração", "classification": "Ativo Circulante"}, {"name": "Matérias-primas", "classification": "Ativo Circulante"}, {"name": "ICMS a Recuperar", "classification": "Ativo Circulante"}, {"name": "PIS/COFINS a Recuperar", "classification": "Ativo Circulante"}, {"name": "IRRF a Recuperar", "classification": "Ativo Circulante"}, {"name": "Adiantamento a Fornecedores", "classification": "Ativo Circulante"}, {"name": "Adiantamento a Empregados", "classification": "Ativo Circulante"}, {"name": "Seguros a Vencer", "classification": "Ativo Circulante"}, {"name": "Aluguéis a Vencer", "classification": "Ativo Circulante"}, {"name": "PECLD", "classification": "Redutora do Ativo Circulante"}, {"name": "Perda para Ajuste ao VRL", "classification": "Redutora do Ativo Circulante"}, {"name": "Clientes LP", "classification": "Ativo Não Circulante — Realizável a Longo Prazo"}, {"name": "Estoques LP", "classification": "Ativo Não Circulante — Realizável a Longo Prazo"}, {"name": "Empréstimos a Diretor", "classification": "Ativo Não Circulante — Realizável a Longo Prazo"}, {"name": "Empréstimos a Sócio", "classification": "Ativo Não Circulante — Realizável a Longo Prazo"}, {"name": "Empréstimos a Controladas", "classification": "Ativo Não Circulante — Realizável a Longo Prazo"}, {"name": "Empréstimos a Coligadas", "classification": "Ativo Não Circulante — Realizável a Longo Prazo"}, {"name": "PECLD LP", "classification": "Redutora do Realizável a Longo Prazo"}, {"name": "Perda E  "Ativo Não Circulante — Intangível"}, {"name": "Ativos de Desenvolvimento", "classification": "Ativo Não Circulante — Intangível"}, {"name": "Amortização Acumulada", "classification": "Redutora do Intangível"}, {"name": "Impairment (acumulado do Intangível)", "classification": "Redutora do Intangível"}, {"name": "Fornecedores", "classification": "Passivo Circulante"}, {"name": "Duplicatas a Pagar", "classification": "Passivo Circulante"}, {"name": "Empréstimos CP", "classification": "Passivo Circulante"}, {"name": "Duplicatas Descontadas", "classification": "Passivo Circulante"}, {"name": "Salários a Pagar", "classification": "Passivo Circulante"}, {"name": "INSS / FGTS a Recolher", "classification": "Passivo Circulante"}, {"name": "Tributos a Recolher", "classification": "Passivo Circulante"}, {"name": "Provisão para 13º", "classification": "Passivo Circulante"}, {"name": "Provisão para Férias", "classification": "Passivo Circulante"}, {"name": "Receita Antecipada", "classification": "Passivo Circulante"}, {"name": "Provisão para Garantias", "classification": "Passivo Circulante"}, {"name": "Encargos Financeiros a Apropriar (CP)", "classification": "Redutora do Passivo Circulante"}, {"name": "Empréstimos LP", "classification": "Passivo Não Circulante"}, {"name": "Financiamentos LP", "classification": "Passivo Não Circulante"}, {"name": "Debêntures", "classification": "Passivo Não Circulante"}, {"name": "Parcelamentos Tributários LP", "classification": "Passivo Não Circulante"}, {"name": "Provisão para Contingências LP", "classification": "Passivo Não Circulante"}, {"name": "Passivo Fiscal Diferido", "classification": "Passivo Não Circulante"}, {"name": "Receita Diferida LP", "classification": "Passivo Não Circulante"}, {"name": "Encargos Financeiros a Apropriar (LP)", "classification": "Redutora do Passivo Não Circulante"}, {"name": "Capital Social", "classification": "Patrimônio Líquido"}, {"name": "Reservas de Capital", "classification": "Patrimônio Líquido"}, {"name": "Reservas de Lucros", "classification": "Patrimônio Líquido"}, {"name": "Ajustes de Avaliação Patrimonial", "classification": "Patrimônio Líquido"}, {"name": "Outros Resultados Abrangentes", "classification": "Patrimônio Líquido"}, {"name": "Ações em Tesouraria", "classification": "Redutora do Patrimônio Líquido"}, {"name": "Capital a Integralizar", "classification": "Redutora do Patrimônio Líquido"}, {"name": "Prejuízos Acumulados", "classification": "Redutora do Patrimônio Líquido"}, {"name": "Receita de Vendas", "classification": "Conta de Resultado — Receita"}, {"name": "Receita de Serviços", "classification": "Conta de Resultado — Receita"}, {"name": "Receita Financeira", "classification": "Conta de Resultado — Receita"}, {"name": "Receita de Aluguéis", "classification": "Conta de Resultado — Receita"}, {"name": "Ganho na Venda de Ativos", "classification": "Conta de Resultado — Receita"}, {"name": "Reversão de Provisões", "classification": "Conta de Resultado — Receita"}, {"name": "CMV / CPV / CSP", "classification": "Conta de Resultado — Despesa"}, {"name": "Despesas Administrativas", "classification": "Conta de Resultado — Despesa"}, {"name": "Despesas Comerciais", "classification": "Conta de Resultado — Despesa"}, {"name": "Despesas Financeiras", "classification": "Conta de Resultado — Despesa"}, {"name": "PECLD (Despesa)", "classification": "Conta de Resultado — Despesa"}, {"name": "Perda de Estoques", "classification": "Conta de Resultado — Despesa"}, {"name": "Impairment (Despesa)", "classification": "Conta de Resultado — Despesa"}, {"name": "IRPJ", "classification": "Conta de Resultado — Despesa"}, {"name": "CSLL", "classification": "Conta de Resultado — Despesa"}];const KEY='moreira-contas-quiz-v1';const app=document.getElementById('app');let state=null,chosen=null,sound=true,ctx;try{state=JSON.parse(localStorage.getItem(KEY));if(!state||state.deck.length!==BANK.length)state=null}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){let name=document.getElementById('name').value.trim();if(!name){document.getElementById('name').focus();return}const flags=shuffle(BANK.map((_,i)=>i%2===0));state={name,index:0,answers:{},deck:shuffle(BANK.map((q,i)=>{let truth=flags[i];let options=[...new Set(BANK.map(x=>x.classification))].filter(c=>c!==q.classification);return {name:q.name,shown:truth?q.classification:options[Math.floor(Math.random()*options.length)],truth}}))};save();render()}async function beep(ok){if(!sound)return;try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;ctx=ctx||new AudioCtx();if(ctx.state!=='running')await ctx.resume();const now=ctx.currentTime+.025;const notes=ok?[{f:660,t:0,d:.22},{f:880,t:.24,d:.3}]:[{f:480,t:0,d:.3},{f:360,t:.34,d:.4}];notes.forEach(n=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?'sine':'square';o.frequency.setValueAtTime(n.f,now+n.t);o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0,now+n.t);g.gain.linearRampToValueAtTime(ok?.24:.20,now+n.t+.015);g.gain.setValueAtTime(ok?.24:.20,now+n.t+n.d-.04);g.gain.linearRampToValueAtTime(0,now+n.t+n.d);o.start(now+n.t);o.stop(now+n.t+n.d+.01)})}catch(e){console.warn('Não foi possível reproduzir o som.',e)}}function correct(){return Object.values(state.answers).filter(a=>a.ok).length}function select(v){chosen=v;render()}function confirmAnswer(){if(chosen===null||state.answers[state.index])return;const ok=chosen===state.deck[state.index].truth;state.answers[state.index]={choice:chosen,ok};save();beep(ok);render()}function move(delta){state.index=Math.max(0,Math.min(state.deck.length,state.index+delta));chosen=null;save();render()}function reset(){if(confirm('Reiniciar o quiz com uma nova ordem? O placar atual será apagado.')){state=null;try{localStorage.removeItem(KEY)}catch(e){}chosen=null;render()}}function toggleSound(){sound=!sound;render()}function render(){if(!state){app.innerHTML=`<section><p class="muted">CERTO OU ERRADO</p><h1>Quiz de<br>Contas Contábeis</h1><p>${BANK.length} contas • ordem aleatória<br>Uma questão por tela.</p><p>Julgue a classificação apresentada.<br>🟢 Acertou &nbsp; 🔴 Errou</p><label for="name">Nome do aluno</label><input id="name" autocomplete="name" maxlength="80" placeholder="Digite seu nome"><button class="spaced" onclick="start()">Começar o quiz →</button><p class="muted">Classificações conforme o PDF do curso. CP = curto prazo; LP = longo prazo.</p></section>`;return}if(state.index===state.deck.length){app.innerHTML=`<section><p class="muted">QUIZ CONCLUÍDO</p><h1>Resultado de ${esc(state.name)}</h1><div class="card"><div class="score">${correct()} / ${BANK.length}</div><p>${Math.round(correct()/BANK.length*100)}% de acertos</p><p>${BANK.length-correct()} erros</p></div><button onclick="reset()">Jogar novamente ↻</button><button class="spaced" onclick="move(-1)">← Voltar</button></section>`;return}const q=state.deck[state.index],a=state.answers[state.index];app.innerHTML=`<section class="${a?(a.ok?'good':'bad'):''}"><div class="top"><span>Questão ${state.index+1} de ${BANK.length}</span><span>${correct()} acertos</span></div><div class="progress"><span style="width:${(state.index+1)/BANK.length*100}%"></span></div><div class="card"><p class="muted">CONTA CONTÁBIL</p><div class="account">${esc(q.name)}</div><p class="muted">CLASSIFICAÇÃO APRESENTADA</p><div class="classification">${esc(q.shown)}</div></div><p style="font-size:20px;text-align:center">Essa classificação está certa ou errada?</p><div class="choices"><button ${a?'disabled':''} class="${(a?a.choice:chosen)===true?'selected':''}" onclick="select(true)">Certo</button><button ${a?'disabled':''} class="${(a?a.choice:chosen)===false?'selected':''}" onclick="select(false)">Errado</button></div><div class="feedback" role="status" aria-live="polite"><span class="lamp"></span><span>${a?(a.ok?'Você acertou!':'Você errou!'):''}</span></div>${a?`<button onclick="move(1)">${state.index===BANK.length-1?'Ver resultado':'Próxima →'}</button>`:`<button onclick="confirmAnswer()" ${chosen===null?'disabled':''}>Confirmar resposta</button>`}<div class="nav"><button onclick="move(-1)" ${state.index===0?'disabled':''}>← Voltar</button><button onclick="reset()">Reiniciar ↻</button></div><button class="spaced" style="font-size:15px;background:transparent;color:#235c94" onclick="toggleSound()">${sound?'🔊 Som ligado':'🔇 Som desligado'}</button></section>`}render();
